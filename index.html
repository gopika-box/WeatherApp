<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Weather App</title>
</head>
<body class="bg-[#2561A0] min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 w-full max-w-md shadow-2xl text-white flex flex-col items-center">
       
        <div class="flex gap-2 w-full mb-8">
            <input type="text" placeholder="Enter city name" 
                   class="search-input flex-1 px-4 py-3 text-lg rounded-xl bg-white/20 border border-white/10 placeholder-white/60 text-white focus:outline-none focus:ring-2 focus:ring-white/40 transition-all">
            <button class="search-btn bg-white/20 hover:bg-white/30 px-5 py-3 rounded-xl border border-white/10 text-xl cursor-pointer transition-colors active:scale-95">
                🔍
            </button>
        </div>

        <div class="weather w-full flex flex-col items-center text-center">
            
            <div class="mb-8">
                <div class="w-36 h-36 mx-auto mb-4 flex items-center justify-center">
                    <img src="images/mainlyCloud.jpg" alt="Weather Status" class="max-w-full max-h-full object-contain rounded-2xl shadow-lg">
                </div>
                <h1 class="city-temp text-6xl font-bold tracking-tight mb-1">22°C</h1>
                <h2 class="city-name text-2xl font-medium text-white/80">Kerala</h2>
            </div>

            <div class="grid grid-cols-2 gap-4 w-full border-t border-white/10 pt-6 mt-2">
                
                <div class="humidity flex items-center gap-3 bg-white/5 p-4 rounded-2xl border border-white/5">
                    <div class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-xl">
                        <span class="text-xl">💧</span> 
                    </div>
                    <div class="text-left">
                        <p class="humidity-val text-xl font-semibold leading-tight">50%</p>
                        <p class="text-xs text-white/60 font-medium tracking-wide uppercase mt-0.5">Humidity</p>
                    </div>
                </div>

                <div class="wind flex items-center gap-3 bg-white/5 p-4 rounded-2xl border border-white/5">
                    <div class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-xl">
                        <span class="text-xl">💨</span>
                    </div>
                    <div class="text-left">
                        <p class="wind-val text-xl font-semibold leading-tight">15 km/h</p>
                        <p class="text-xs text-white/60 font-medium tracking-wide uppercase mt-0.5">Wind Speed</p>
                    </div>
                </div>

            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
